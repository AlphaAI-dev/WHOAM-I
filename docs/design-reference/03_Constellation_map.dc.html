<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still Becoming — Constellation map</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter+Tight:wght@400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111110}
.sb{font-family:'Inter Tight',system-ui,sans-serif;color:#F2EFE8;-webkit-font-smoothing:antialiased}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.sb button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sb button:focus-visible,.sb a:focus-visible{outline:1px solid #FF5A1F;outline-offset:4px}
a{color:#F2EFE8}a:hover{color:#FF5A1F}
@keyframes twinkle{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * 0.35)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.star{animation:twinkle 6s ease-in-out infinite}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.edge{transition:stroke-opacity .5s ease,stroke .5s ease}
@media (prefers-reduced-motion:reduce){.sb .star{animation:none}.sb .fade{opacity:1;animation:none}.sb .edge{transition:none}}
.rm .star{animation:none}.rm .fade{opacity:1;animation:none}.rm .edge{transition:none}
</style>
</helmet>
<main class="{{rootClass}}" style="position: relative; box-sizing: border-box; width: 100%; min-height: 100vh; padding: 32px clamp(20px, 5vw, 72px); background: #111110; color: #F2EFE8; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
<span class="star" style="{{s.style}}"></span>
</sc-for>
</div>
<header style="position: relative; display: flex; justify-content: space-between; align-items: center; gap: 16px">
<span class="mono" style="font-size: 12px; letter-spacing: 0.22em; color: #8C8A84">STILL BECOMING · MAP</span>
<a href="Tree.dc.html" aria-label="Close map" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; min-width: 44px; text-decoration: none">
<span class="mono" style="font-size: 12px; letter-spacing: 0.16em; color: #8C8A84">CLOSE</span>
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 1 L13 13 M13 1 L1 13"></path></svg>
</a>
</header>
<section style="position: relative; flex-grow: 1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px">
<div style="flex: 1 1 300px; max-width: 380px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px">
<span class="mono" style="font-size: 12px; letter-spacing: 0.16em; color: #FF5A1F">CHAPTER {{act.num}}</span>
<h2 class="serif" style="margin: 0; font-size: clamp(40px, 4vw, 56px); line-height: 1; font-weight: 400">{{act.name}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #8C8A84">Connected to {{act.links}}.</p>
<a href="{{act.href}}" class="mono" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-size: 12px; letter-spacing: 0.16em; text-decoration: none; border-bottom: 1px solid rgba(242,239,232,0.3)">GO TO CHAPTER →</a>
</div>
<div style="flex: 999 1 560px; min-width: 0; align-self: center">
<div style="position: relative; width: 100%; max-width: 1000px; aspect-ratio: 1000 / 640; margin: 0 auto">
<svg viewBox="0 0 1000 640" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
<g fill="none" stroke-width="1">
<line class="edge" x1="180" y1="420" x2="330" y2="220" stroke="{{ed.a.stroke}}" stroke-opacity="{{ed.a.op}}"></line>
<line class="edge" x1="330" y1="220" x2="520" y2="140" stroke="{{ed.b.stroke}}" stroke-opacity="{{ed.b.op}}"></line>
<line class="edge" x1="520" y1="140" x2="700" y2="260" stroke="{{ed.c.stroke}}" stroke-opacity="{{ed.c.op}}"></line>
<line class="edge" x1="700" y1="260" x2="840" y2="470" stroke="{{ed.d.stroke}}" stroke-opacity="{{ed.d.op}}"></line>
<line class="edge" x1="330" y1="220" x2="700" y2="260" stroke="{{ed.e.stroke}}" stroke-opacity="{{ed.e.op}}"></line>
<line class="edge" x1="840" y1="470" x2="960" y2="560" stroke="#F2EFE8" stroke-opacity="0.18" stroke-dasharray="2 6"></line>
</g>
</svg>
<sc-for list="{{points}}" as="pt" hint-placeholder-count="5">
<button class="fade" type="button" onClick="{{pt.pick}}" onMouseEnter="{{pt.hover}}" onMouseLeave="{{unhover}}" onFocus="{{pt.hover}}" onBlur="{{unhover}}" aria-pressed="{{pt.pressed}}" aria-label="Chapter {{pt.num}}: {{pt.name}}" style="{{pt.btnStyle}}">
<span style="display: flex; width: 24px; height: 24px; align-items: center; justify-content: center; flex-shrink: 0">
<span style="{{pt.dotStyle}}"></span>
</span>
<span class="mono" style="{{pt.labelStyle}}">{{pt.num}} · {{pt.name}}</span>
</button>
</sc-for>
</div>
</div>
</section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reduceMotion":{"editor":"boolean","default":false,"section":"Motion"},"starCount":{"editor":"range","default":110,"min":40,"max":200,"step":10,"section":"Star field"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 'ii', hover: null }; }
renderVals() {
const n = this.props.starCount ?? 110;
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const stars = [];
for (let i = 0; i < n; i++) {
const x = (rnd() * 100).toFixed(2), y = (rnd() * 100).toFixed(2);
const r = rnd() < 0.85 ? 1 : 2;
const o = (0.15 + rnd() * 0.45).toFixed(2);
const d = (rnd() * 6).toFixed(2);
stars.push({ style: 'position: absolute; left: ' + x + '%; top: ' + y + '%; width: ' + r + 'px; height: ' + r + 'px; border-radius: 50%; background: #F2EFE8; opacity: ' + o + '; --o: ' + o + '; animation-delay: -' + d + 's' });
}
const base = [
{ id: 'i', num: 'I', name: 'Roots', x: 180, y: 420, href: 'Tree.dc.html' },
{ id: 'ii', num: 'II', name: 'Learning', x: 330, y: 220, href: 'Tree.dc.html' },
{ id: 'iii', num: 'III', name: 'Building', x: 520, y: 140, href: 'Tree.dc.html' },
{ id: 'iv', num: 'IV', name: 'People', x: 700, y: 260, href: 'Timeline.dc.html' },
{ id: 'v', num: 'V', name: 'Unwritten', x: 840, y: 470, href: 'Unfinished.dc.html' }
];
const edges = { a: ['i', 'ii'], b: ['ii', 'iii'], c: ['iii', 'iv'], d: ['iv', 'v'], e: ['ii', 'iv'] };
const act = this.state.hover || this.state.sel;
const ed = {};
Object.keys(edges).forEach((k) => {
const on = edges[k].indexOf(act) >= 0;
ed[k] = on ? { stroke: '#FF5A1F', op: 0.85 } : { stroke: '#F2EFE8', op: 0.16 };
});
const linked = (id) => {
const s = {};
Object.keys(edges).forEach((k) => { const e = edges[k]; if (e[0] === id) s[e[1]] = 1; if (e[1] === id) s[e[0]] = 1; });
return s;
};
const near = linked(act);
const points = base.map((c, i) => {
const on = c.id === act;
const lit = on || near[c.id];
return Object.assign({}, c, {
pressed: c.id === this.state.sel ? 'true' : 'false',
pick: () => this.setState({ sel: c.id }),
hover: () => this.setState({ hover: c.id }),
btnStyle: 'position: absolute; left: ' + (c.x / 10) + '%; top: ' + (c.y / 6.4).toFixed(2) + '%; transform: translate(-22px, -50%); display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px; animation-delay: ' + (0.3 + i * 0.15) + 's',
dotStyle: on ? 'width: 10px; height: 10px; border-radius: 50%; background: #FF5A1F; box-shadow: 0 0 0 7px rgba(255,90,31,0.14)' : 'width: ' + (lit ? 7 : 5) + 'px; height: ' + (lit ? 7 : 5) + 'px; border-radius: 50%; background: #F2EFE8; opacity: ' + (lit ? 1 : 0.6),
labelStyle: 'font-size: 11px; letter-spacing: 0.14em; white-space: nowrap; color: ' + (lit ? '#F2EFE8' : '#8C8A84')
});
});
const a = base.find((c) => c.id === act);
const links = base.filter((c) => near[c.id]).map((c) => c.name).join(', ');
return {
rootClass: this.props.reduceMotion ? 'sb rm' : 'sb',
stars, ed, points,
unhover: () => this.setState({ hover: null }),
act: { num: a.num, name: a.name, href: a.href, links: links || 'nothing yet' }
};
}
}
</script>
</body>
</html>
